name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # Ephemeral CI database values—not production secrets
      POSTGRES_USERNAME: news
      POSTGRES_PASSWORD: ci-test-password

      # Application configuration
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
      JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}

      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      GITHUB_CLIENT_ID: ${{ secrets.GTHUB_CLIENT_ID }}
      GITHUB_CLIENT_SECRET: ${{ secrets.GTHUB_CLIENT_SECRET }}

      SONAR_TOKEN: ${{ secrets.SONAR_CLOUD_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run tests
        run: ./mvnw --batch-mode --no-transfer-progress verify  -Ddependency-check.skip=true  -DskipPitest=true