services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg18-trixie
    container_name: news-postgres-test
    environment:
      POSTGRES_DB: news_test
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U news -d news" ]
      interval: 5s
      timeout: 5s
      retries: 10

