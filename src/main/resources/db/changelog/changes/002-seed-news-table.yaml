                  valueDate: "2026-07-13T09:00:00"
              - column:
                  name: updated_at
                  valueDate: "2026-07-13T09:00:00"
        - insert:
            tableName: news
            columns:
              - column:
                  name: title
                  value: "Riverton Launches Six-Month Electric Bus Pilot"
              - column:
                  name: details
                  value: "Riverton has introduced twelve electric buses on three of its busiest routes as part of a six-month transport pilot. City officials will measure reliability, passenger feedback, energy use, and operating costs before deciding whether to expand the fleet next year."
              - column:
                  name: reported_by
                  value: "Editor"
              - column:
                  name: reported_at
                  valueDate: "2026-07-13T10:00:00"
              - column:
                  name: updated_at
                  valueDate: "2026-07-13T10:00:00"
