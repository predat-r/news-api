              - column:
                  name: title
                  value: "Tens of Thousands Evacuated as Wildfires Spread Across Southern France"
              - column:
                  name: details
                  value: "Tens of thousands of residents and tourists have been evacuated from several towns in southern France after strong winds and prolonged dry conditions caused wildfires to spread rapidly across forested areas. Emergency services deployed hundreds of firefighters, water-bombing aircraft, and helicopters to contain the flames and protect nearby communities. Several roads were temporarily closed, while local authorities opened emergency shelters for displaced families and visitors. Officials said no major loss of life had been reported, but a number of homes, farms, and public buildings were damaged. Weather forecasters warned that high temperatures and gusty winds could continue to complicate firefighting operations over the next two days."
              - column:
                  name: reported_by
                  value: "reporter1"
