                  name: title
                  value: "Northbridge University Opens Community Greenhouse"
              - column:
                  name: details
                  value: "Northbridge University has opened a rooftop greenhouse where students and local volunteers will grow vegetables throughout the year. The project will support agricultural research, host free gardening workshops, and donate part of each harvest to nearby food banks.."
