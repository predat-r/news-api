spring:
  application:
    name: news


  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/news}
    username: ${POSTGRES_USERNAME:news}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  ai:
    google:
        genai:
          api-key: ${GEMINI_API_KEY}
          chat:
            model: gemini-3.6-flash
          embedding:
            text:
              model: gemini-embedding-2
              dimensions: 768
            api-key: ${GEMINI_API_KEY}
    vectorstore:
      pgvector:
        initialize-schema: true



  cache:
    type: hazelcast
    cache-names:
      - newsById

  hazelcast:
    config: classpath:hazelcast.yaml

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        generate_statistics: true
        format_sql: true
        jdbc:
          time_zone: UTC

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  security:
    jwt:
      private-key: ${JWT_PRIVATE_KEY}
      public-key: ${JWT_PUBLIC_KEY}

    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
management:
  endpoints:
    web:
      exposure:
        include: "*"
  tracing:
    sampling:
      probability: 1

  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces

  otlp:
    metrics:
      export:
        enabled: false



logging:
  level:

    liquibase: debug
    sql: debug
    org.springframework.security: debug
    org.hibernate: debug
    com.hazelcast.system: warn




