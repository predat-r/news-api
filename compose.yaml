services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
  postgres:
    image: pgvector/pgvector:0.8.5-pg18-trixie
    container_name: news-postgres
    environment:
      POSTGRES_DB: news
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U news -d news" ]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres18_data: